<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premier Hotel — Facility Inspection</title>
<style>
:root{
  --coral:#F5A99A; --sage:#87C992; --indigo:#2A3578; --purple:#5B3A9E;
  --bg:#F7F8FB; --card:#FFFFFF; --line:#E4E7EF; --text:#1E2233; --muted:#6B7088;
  --pass:#3FA76A; --fail:#E0533D; --na:#9097AC;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.4}
.wrap{max-width:860px;margin:0 auto;padding:16px 14px 120px}
header{background:linear-gradient(120deg,var(--indigo),var(--purple));color:#fff;border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(42,53,120,.18)}
.brand-logo{display:block;background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:14px;width:max-content;max-width:100%;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.brand-logo img{display:block;height:46px;width:auto}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.3px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:12px;border:none;border-radius:12px;background:var(--card);color:var(--muted);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.tab.active{background:var(--indigo);color:#fff}
.meta{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.meta label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.meta input{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--text)}
.meta input:focus{outline:none;border-color:var(--purple)}
.section{margin-bottom:18px}
.section h2{font-size:14px;font-weight:800;color:var(--indigo);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px;padding-left:4px}
.item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);border-left:4px solid var(--line);transition:border-color .2s}
.item.s-pass{border-left-color:var(--pass)}
.item.s-fail{border-left-color:var(--fail)}
.item.s-na{border-left-color:var(--na)}
.item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item .label{font-weight:700;font-size:15px;flex:1}
.item .sub{font-weight:400;font-size:13px;color:var(--muted);margin-top:2px;display:block}
.freq{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;background:#EEF0F7;color:var(--purple);white-space:nowrap;letter-spacing:.4px}
.btns{display:flex;gap:6px;margin-top:10px}
.btns button{flex:1;padding:9px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.btns button.on-pass{background:var(--pass);border-color:var(--pass);color:#fff}
.btns button.on-fail{background:var(--fail);border-color:var(--fail);color:#fff}
.btns button.on-na{background:var(--na);border-color:var(--na);color:#fff}
.note{width:100%;margin-top:8px;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;font-family:inherit;resize:vertical;background:#fff;color:var(--text);display:none}
.item.show-note .note{display:block}
.remarks{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.remarks textarea{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;min-height:70px;resize:vertical;color:var(--text)}
.progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 10px;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--pass));width:0;transition:width .3s}
.pmeta{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);margin-top:5px}
.actionbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;max-width:860px;margin:0 auto;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.actionbar button{flex:1;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer}
.btn-save{background:var(--sage);color:#16321f}
.btn-pdf{background:var(--indigo);color:#fff}
.btn-ghost{background:#EEF0F7;color:var(--indigo);flex:0 0 auto;padding:14px 18px}
.history-item{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.history-item .h-meta{font-size:13px;color:var(--muted);margin-top:3px}
.history-item .h-stats{font-size:12px;font-weight:700;margin-top:4px}
.history-item .pill{display:inline-block;padding:2px 8px;border-radius:20px;margin-right:5px}
.pill.p{background:#E3F4EA;color:var(--pass)}.pill.f{background:#FBE5E0;color:var(--fail)}.pill.n{background:#EEF0F2;color:var(--na)}
.h-actions button{border:none;background:#EEF0F7;color:var(--indigo);border-radius:9px;padding:8px 10px;font-weight:700;cursor:pointer;margin-left:6px;font-size:13px}
.h-actions .del{background:#FBE5E0;color:var(--fail)}
.empty{text-align:center;color:var(--muted);padding:50px 20px}
.hidden{display:none}
@media(max-width:560px){.meta{grid-template-columns:1fr}}
</style>
</head>

    {l:"Locker room / changing area — clean & stocked", s:"Soap, paper towels, sanitizer", f:"DAILY"},
  ]},
  {group:"Pool Deck & Safety", items:[
    {l:"Pool deck — clear, non-slip surface dry-mopped", s:"", f:"DAILY"},
    {l:"Rescue ring buoys — present at each end", s:"Check rope not tangled", f:"DAILY"},
    {l:"Depth markers — clearly visible on deck & walls", s:"", f:"WEEKLY"},
    {l:"No-diving signs — in place at shallow end", s:"", f:"WEEKLY"},
    {l:"Shower & foot bath — flowing, clean", s:"", f:"DAILY"},
    {l:"Changing rooms — clean, drains clear, supplies stocked", s:"", f:"DAILY"},
  ]},
];

const KEY="premier_inspections_v1";
let state={}; // id -> {status, note}

function itemId(g,i){return "g"+g+"i"+i;}

function buildForm(){
  const root=document.getElementById('sections');
  root.innerHTML='';
  DATA.forEach((grp,gi)=>{
    const sec=document.createElement('div');sec.className='section';
    sec.innerHTML='<h2>'+grp.group+'</h2>';
    grp.items.forEach((it,ii)=>{
      const id=itemId(gi,ii);
      const card=document.createElement('div');card.className='item';card.id='card_'+id;
      card.innerHTML=`
        <div class="top">
          <div class="label">${it.l}${it.s?'<span class="sub">'+it.s+'</span>':''}</div>
          <span class="freq">${it.f}</span>
        </div>
        <div class="btns">
          <button onclick="setStatus('${id}','pass')" data-b="pass">✓ Pass</button>
          <button onclick="setStatus('${id}','fail')" data-b="fail">✗ Fail</button>
          <button onclick="setStatus('${id}','na')" data-b="na">N/A</button>
        </div>
        <textarea class="note" placeholder="Notes / observations..." oninput="setNote('${id}',this.value)"></textarea>`;
      sec.appendChild(card);
    });
    root.appendChild(sec);
  });
}

function setStatus(id,st){
  if(!state[id])state[id]={};
  state[id].status = state[id].status===st ? null : st;
  renderItem(id); updateProgress();
}
function setNote(id,v){ if(!state[id])state[id]={}; state[id].note=v; }

function renderItem(id){
  const card=document.getElementById('card_'+id);
  const st=state[id]?.status;
  card.className='item'+(st?' s-'+st:'')+((st==='fail'||state[id]?.note)?' show-note':'');
  card.querySelectorAll('.btns button').forEach(b=>{
    b.className = (b.dataset.b===st) ? 'on-'+st : '';
  });
}

function updateProgress(){
  let total=0,done=0,fails=0;
  DATA.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    total++; const s=state[itemId(gi,ii)]?.status;
    if(s)done++; if(s==='fail')fails++;
  }));
  document.getElementById('barFill').style.width=(total?done/total*100:0)+'%';
  document.getElementById('pCount').textContent=done+' of '+total+' checked';
  document.getElementById('pFail').textContent=fails?('⚠ '+fails+' failed'):'';
  document.getElementById('pFail').style.color='var(--fail)';
}

function gatherMeta(){
  return {
    date:document.getElementById('m_date').value,
    shift:document.getElementById('m_shift').value,
    inspector:document.getElementById('m_inspector').value,
    sign:document.getElementById('m_sign').value,
    remarks:document.getElementById('r_remarks').value
  };
}

function resetForm(){
  state={}; buildForm();
  ['m_shift','m_inspector','m_sign','r_remarks'].forEach(x=>document.getElementById(x).value='');
  document.getElementById('m_date').value=new Date().toISOString().slice(0,10);
  updateProgress(); window.scrollTo(0,0);
}

function saveRecord(){
  const meta=gatherMeta();
  if(!meta.date){alert('Please set a date.');return;}
  const counts={pass:0,fail:0,na:0};
  Object.values(state).forEach(v=>{if(v.status)counts[v.status]++;});
  const rec={id:Date.now(),meta,state:JSON.parse(JSON.stringify(state)),counts,saved:new Date().toISOString()};
  const all=load(); all.unshift(rec); localStorage.setItem(KEY,JSON.stringify(all));
  alert('Saved ✓  Find it under History.');
}

function load(){ try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return [];} }

function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  document.getElementById('view-form').classList.toggle('hidden',v!=='form');
  document.getElementById('view-history').classList.toggle('hidden',v!=='history');
  document.getElementById('formActions').classList.toggle('hidden',v!=='form');
  if(v==='history')renderHistory();
}

function renderHistory(){
  const list=document.getElementById('historyList'); const all=load();
  if(!all.length){list.innerHTML='<div class="empty">No saved inspections yet.<br>Complete a form and tap Save.</div>';return;}
  list.innerHTML='';
  all.forEach(r=>{
    const d=document.createElement('div');d.className='history-item';
    d.innerHTML=`
      <div>
        <strong>${r.meta.date||'(no date)'}</strong>
        <div class="h-meta">${[r.meta.shift,r.meta.inspector].filter(Boolean).join(' · ')||'—'}</div>
        <div class="h-stats">
          <span class="pill p">${r.counts.pass} pass</span>
          <span class="pill f">${r.counts.fail} fail</span>
          <span class="pill n">${r.counts.na} n/a</span>
        </div>
      </div>
      <div class="h-actions">
        <button onclick="loadRecord(${r.id})">Open</button>
        <button class="del" onclick="delRecord(${r.id})">Delete</button>
      </div>`;
    list.appendChild(d);
  });
}

function loadRecord(id){
  const r=load().find(x=>x.id===id); if(!r)return;
  state=JSON.parse(JSON.stringify(r.state));
  document.getElementById('m_date').value=r.meta.date||'';
  document.getElementById('m_shift').value=r.meta.shift||'';
  document.getElementById('m_inspector').value=r.meta.inspector||'';
  document.getElementById('m_sign').value=r.meta.sign||'';
  document.getElementById('r_remarks').value=r.meta.remarks||'';
  buildForm();
  DATA.forEach((g,gi)=>g.items.forEach((it,ii)=>{
    const id2=itemId(gi,ii);
    if(state[id2]){
      const card=document.getElementById('card_'+id2);
      if(state[id2].note)card.querySelector('.note').value=state[id2].note;
      renderItem(id2);
    }
  }));
  updateProgress(); switchView('form'); window.scrollTo(0,0);
}

function delRecord(id){
  if(!confirm('Delete this inspection?'))return;
  localStorage.setItem(KEY,JSON.stringify(load().filter(x=>x.id!==id)));
  renderHistory();
}
